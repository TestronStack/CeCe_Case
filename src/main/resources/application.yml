spring:
  application:
    name: ai-testcase-generator
  thymeleaf:
    check-template-location: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    async:
      request-timeout: 600000

server:
  port: 8819
  tomcat:
    uri-encoding: UTF-8
    use-ssl: false
    connection-timeout: 600000

ai:
  # API Key 从环境变量读取（各提供商独立，切换模型时自动读取对应 Key）：
  #   DEEPSEEK_API_KEY - DeepSeek
  #   DASHSCOPE_API_KEY - 通义千问（DashScope）
  #   DOUBAO_API_KEY    - 豆包（火山方舟），亦可用官方别名 ARK_API_KEY
  #   GLM_API_KEY       - 智谱 GLM
  #   OPENAI_API_KEY    - OpenAI GPT
  #   AI_API_KEY        - 通用兜底
  api-key: ${DEEPSEEK_API_KEY:}
  model:
    provider: deepseek
    qwen:
      model-name: qwen-turbo
    deepseek:
      model-name: deepseek-chat
      base-url: https://api.deepseek.com

  # 用例总量预算（条）：按章节均摊控制生成数量，超量自动裁剪低优先级(P2)用例
  case-budget: 120

  prompts:
    extract-interfaces: |
      你是一位资深测试架构师。请从以下需求文档中提取所有API接口定义。

      要求：
      1. 每个接口单独一行
      2. 格式：方法 路径\n参数列表（如果有）
      3. 参数格式：参数名:类型:约束:说明
      4. 去重：同一接口（方法+路径相同）在文档中出现多次时，只输出一次；忽略 curl 命令行示例、调用顺序表、快速验证等重复出现的条目

      示例输出：
      POST /api/user/login
      参数：
        username: 字符串:必填,最大20字符:用户名
        password: 字符串:必填,最大50字符:密码

      GET /api/user/list
      参数：
        page: 整数:可选,默认1:页码
        size: 整数:可选,默认10:每页大小

      文档内容：
      {DOC_CONTENT}

    extract-interfaces-simple: |
      请从以下需求文档中提取所有API接口定义。
      输出格式（每行一个接口）：
      方法 路径|参数名1:类型:说明|参数名2:类型:说明|...

      如果没有找到接口，输出"未找到接口定义"。

      文档内容：
      {DOC_CONTENT}

    generate-testcases: |
      你是一位资深测试架构师。请为以下接口设计【后端接口自动化用例】。

      【事实边界】
      1. 请求路径、方法、参数名和值、账号、URL、事件ID、业务码、响应字段和数据库事实只能来自接口文档；文档没有提供时不要猜测，不要使用本提示词中的示例作为实际数据。
      2. 文档缺少具体值时，使用“文档未指定”或留空，不得写入虚构的可执行值。

      ⚠️ 质量红线（违者回炉重造）：
      1. 一个接口最多生成 8 条用例（1个测试点=1条用例，用等价类/边界值/场景法合并同类场景，覆盖核心流程即可：正向1-2条、参数校验2-3条、边界值1条、异常2-3条；禁止拆分等价类、禁止重复冗余、宁少勿滥）
      2. 参数值必须真实可执行！禁止 xxx、test、abc、123456 等占位符
         - 用户名：admin、zhangsan（禁止 test、user）
         - 手机号：13800138000（禁止 12345678901）
         - 邮箱：admin@example.com（禁止 test@test.com）
         - 金额：用具体数字（如 99.00、1000.00）
      3. 预期结果必须量化！禁止"操作成功"、"页面正常"等模糊描述
         - ✅ 正确：返回 200 + {"code":0,"msg":"success"}，users表新增1条记录
         - ❌ 错误：操作成功
      4. 测试点分类仅限：功能验证/参数校验/边界值/异常场景/数据库校验
      5. 断言必须包含：HTTP状态码 + 业务码(code/msg) + 关键返回字段
      6. 禁止生成重复或等价类冗余用例
      7. 输出格式必须严格按以下 24 列用 | 分隔，不要输出用例编号
      8. 用例优先级：P0=核心主流程/正向场景（必须生成）；P1=常见异常/边界值（建议生成）；P2=组合场景/极端边界/兼容性（可选，不超总数1/3），优先保证 P0/P1
      9. 忽略以下内容不生成用例：UI样式/布局/颜色/字体、文案提示的具体内容、产品背景介绍/业务价值描述、字段说明（仅作参考，不作为独立测试点）
      10. 数量控制：整份文档用例总量控制在 100-150 条之间，覆盖范围较大时优先覆盖核心接口，次要接口适度抽样
      11. 测试环境、版本两列默认留空不填

      必须覆盖的场景：
      - 正向用例（1-2 条）：正常流程 + 核心业务验证
      - 参数校验（2-3 条）：必填项、格式校验、长度边界
      - 异常场景（2-3 条）：空值、非法值、越权访问、token过期、SQL注入
      - 数据库校验（1-2 条）：数据插入/更新后验证数据库状态

      输出格式（24列）：
      测试模块|测试点|用例标题|前置条件|接口路径|请求方法|请求头|请求参数|预期状态码|预期业务码|预期响应JSON|断言规则|数据库校验|优先级|测试环境|版本|测试人|缺陷ID|测试日期|关联UI用例ID|实际结果|测试类型|测试模块代码

      参数填写规范：
      - 测试模块：从路径识别，如/admin/employee→EMPLOYEE
      - 测试点：仅限「功能验证/参数校验/边界值/异常场景/数据库校验」
      - 前置条件：包含具体账号、预置数据、环境信息
      - 请求头：Content-Type: application/json; Authorization: Bearer {token}
      - 请求参数：完整JSON格式，值必须真实可执行
      - 预期状态码：HTTP状态码（200/400/401/403/500等）
      - 预期业务码：业务响应码（0成功/非0错误）
      - 预期响应JSON：完整JSON结构，包含关键字段和值
      - 断言规则：response.code == 0 && response.data.id != null
      - 数据库校验：数据插入/更新/删除后验证（如"users表新增1条记录"）
      - 优先级：P0/P1/P2
      - 测试模块代码：大写英文缩写，与测试模块对应

      输出示例（仅说明字段结构，禁止将示例中的值复制到实际用例）：
      [测试模块]|[测试点]|[用例标题]|[前置条件]|[接口路径]|[请求方法]|[请求头]|[请求参数]|[预期状态码]|[预期业务码]|[预期响应JSON]|[断言规则]|[数据库校验]|[优先级]|[测试环境]|[版本]|[测试人]|[缺陷ID]|[测试日期]|[关联UI用例ID]|[实际结果]|[测试类型]|[测试模块代码]

    generate-testcases-from-requirement: |
      你是一位资深测试工程师。请根据以下需求文档，生成【UI功能测试用例】。

      【事实边界与步骤对应规则】
      1. 只能使用需求文档中明确出现或能够直接概括的页面、操作、字段、状态和埋点信息；不得引用提示词示例、常识或其他文档中的账号、URL、事件ID、参数名、参数值、错误码、时间阈值、数量和固定文案。
      2. 原文没有具体值时，不要猜测，也不要添加“待补充”“参数待确认”等伪字段；在已有字段中写“文档未指定”或“由测试环境提供”，也可以留空。
      3. 测试步骤必须使用连续编号（1.、2.、3.）；预期结果必须使用相同编号（①/1.、②/2.、③/3.均可），第N条预期只验证第N步动作产生的结果，禁止将多个步骤合并到一个预期编号。
      4. 埋点场景可按“执行操作→打开Debug日志→筛选并查看日志”拆分步骤，并分别验证操作结果、日志页面可用性、日志记录及需求规定的参数完整性；事件ID和参数只按原文校验，原文未给出时不得编造。

      ⚠️ 质量红线（必须严格遵守）：
      1. 一个功能生成3-5条代表性用例，禁止重复或为凑数拆分；
      2. 测试点分类仅限：正向/参数校验/边界/异常/UI校验/权限校验；
      3. 优先级仅限：P0/P1/P2；
      4. 预期结果必须可观察、可判定，不得只写“操作成功”“页面正常”“数据正确”；
      5. 输出严格按14列用|分隔，不要输出用例编号，末尾空字段保留分隔符；
      6. 需求未提供的测试数据、环境、版本和文案不要自行补造，宁可填写“文档未指定”或留空。

      输出格式（14列）：
      测试大模块|子模块|测试点分类|用例标题|前置条件|预置测试数据|操作步骤|量化预期结果|优先级|测试环境|版本|实际结果|缺陷单号|测试日期

      只输出符合上述格式的用例行，不要输出解释、Markdown表头或示例。

      需求文档：
      {REQUIREMENT_DOC}
